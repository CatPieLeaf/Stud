# Builds Stud from source and attaches the packages to a release.
#
# It runs when a release is PUBLISHED, and at no other time: no push
# builds, no pull-request builds. Run by hand (workflow_dispatch), it
# builds main, whichever branch it is started from, and leaves every package as an
# artifact of the run: nothing is uploaded to a release and no image is
# pushed, so the pipeline can be exercised without cutting one.
#
# The long pole is ANGLE, which builds from source and takes about an
# hour. It is cached, so that happens once per container image and every
# later release restores it in seconds. The NDK and the extracted bionic
# are cached the same way. Caching works because tools/setup.sh skips any
# dependency that is already present, a cache hit makes it a no-op.

name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

# Read-only by default; the two jobs that need more say so themselves.
# Only `publish` writes to the release, and only the cpak image push needs
# ghcr.io.
permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name || 'main' }}
  cancel-in-progress: false

env:
  # The version the packages carry comes from the tag being released, so
  # an rpm can never disagree with the release it is attached to. Empty
  # on a manual run; .github/actions/setup fills it in from the tree and
  # derives VERSION, the same without a leading "v".
  TAG: ${{ github.event.release.tag_name }}

jobs:
  packages:
    # Built on fedora:44, matching the Fedora this is developed and
    # tested on, so an installed package is the same build that was
    # proven to work, rather than one compiled against an older glibc
    # and hoped to behave the same.
    #
    # The cost, stated plainly: glibc 2.43 becomes the floor for whatever
    # this job produces. Building on an older base is the usual way to
    # keep that floor low; this trades that for the packages matching the
    # build that actually works.
    #
    # The deb is NOT built here, for exactly that reason -- it has its own
    # job on an older base so it reaches older distributions. See the deb
    # job further down.
    #
    # One build of Stud, wrapped several ways: the rpm, the Arch package,
    # the Flatpak and the cpak image all come from the install tree this
    # job produces, so they cannot hold different binaries.
    #
    # The AppImage is the exception and builds its own, on the base its
    # bundled glibc comes from.
    name: Build and package
    permissions:
      contents: read
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - name: Install build dependencies
        # Before checkout on purpose: the image has no git, and
        # actions/checkout and actions/cache both need it and tar.
        run: |
          dnf install -y --setopt=install_weak_deps=False --setopt=max_parallel_downloads=10 \
            gcc-c++ cmake ninja-build git pkgconf-pkg-config rpm-build \
            qt6-qtbase-devel qt6-qtwebengine-devel qtkeychain-qt6-devel \
            wayland-devel wayland-protocols-devel libxkbcommon-devel \
            libXi-devel \
            libglvnd-devel vulkan-loader-devel vulkan-headers \
            freetype-devel openssl-devel \
            'pkgconfig(libavcodec)' 'pkgconfig(libavutil)' 'pkgconfig(libswscale)' \
            curl unzip tar xz zstd python3 e2fsprogs findutils cpio

      - uses: actions/checkout@v7
        with:
          # The tag being released, not whatever the default branch holds:
          # the packages attached to a release must be built from the code
          # that release names.
          ref: ${{ env.TAG || 'main' }}

      - name: Version and dependencies
        uses: ./.github/actions/setup

      - name: Build
        run: |
          # /usr, not CMake's own /usr/local default. The rpm and the
          # deb were never affected, CPACK_PACKAGING_INSTALL_PREFIX
          # pins those, but the install tree every OTHER package is
          # built from comes from `cmake --install`, which honours this
          # and nothing else. Left unset it produced usr/local/bin/stud,
          # which namcap rejects outright ("outside of a valid path") and
          # which the Flatpak manifest cannot find at all.
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DSTUD_REQUIRE_SHADERS=ON \
            -DSTUD_BUILD_TESTS=OFF \
            -DSTUD_VERSION="${VERSION}"
          cmake --build build -j"$(nproc)"

      # One build, several wrappers. Building each format separately would
      # mean several builds of ANGLE and no guarantee the packages contain
      # the same binaries, so the install tree is produced once here and
      # every package is made from it.
      - name: Verify embedded shaders
        # A build with no glslc silently produces an empty shader array,
        # so an upscaler is present in Settings and does nothing. That
        # shipped once: the released render-host carried one SPIR-V
        # module where a correct build carries three.
        # -DSTUD_REQUIRE_SHADERS=ON makes the configure fail now; this
        # checks the binary itself, because the thing that matters is
        # what is IN it.
        #
        # The three are RAVU-Zoom anti-ringing, SGSR edge-direction, and
        # RCAS, which sharpens after RAVU.
        #
        # The magic number is not counted on its own any more. It occurs
        # by coincidence in compiled code -- it does in this very binary,
        # once, in .text -- so the old "at least three" would have passed
        # a build that had lost a shader and kept the accident. The
        # header is validated instead, and the count has to be exact.
        run: |
          python3 - <<'PY'
          import struct, sys
          p = "build/render-host/stud-render-host"
          blob = open(p, "rb").read()
          MAGIC = b"\x03\x02\x23\x07"
          # A SPIR-V header is five words: magic, version, generator,
          # bound, schema. Version is 0x00MMmm00, schema is reserved and
          # zero, and the id bound is small. Random code satisfies the
          # magic; it does not satisfy these.
          modules = 0
          at = blob.find(MAGIC)
          while at != -1:
              if at + 20 <= len(blob):
                  _m, version, _g, bound, schema = struct.unpack_from("<5I", blob, at)
                  major, minor = (version >> 16) & 0xff, (version >> 8) & 0xff
                  if ((version & 0xff000000) == 0 and (version & 0xff) == 0
                          and 1 <= major <= 2 and minor <= 6
                          and schema == 0 and 0 < bound < (1 << 22)):
                      modules += 1
              at = blob.find(MAGIC, at + 1)
          print(f"{p}: {modules} SPIR-V module(s), {blob.count(MAGIC)} raw magic hit(s)")
          if modules != 3:
              print("::error::the render host should carry exactly three embedded "
                    "shaders -- RAVU-Zoom anti-ringing, SGSR edge-direction and "
                    "RCAS -- and carries " + str(modules) + ". They are built by "
                    "glslc, which the configure step should have found in the NDK.")
              sys.exit(1)
          PY

      - name: Build rpm
        # The rpm only. The deb has its own job, on the oldest Ubuntu it
        # is meant to run on; see the comment there for what a deb built
        # against a newer Qt actually did on the distributions it is for.
        run: cd build && cpack -G RPM

      - name: Stage install tree
        run: |
          DESTDIR="$PWD/install-tree" cmake --install build
          # The layout every package below assumes. Checked here so a
          # wrong install prefix fails immediately, with the reason, at
          # the step that produced it, rather than surfacing much later
          # as a namcap error or a Flatpak "cannot stat usr/bin/.".
          for required in usr/bin/stud usr/lib/stud usr/libexec/stud usr/share/metainfo; do
            if [ ! -e "install-tree/$required" ]; then
              echo "::error::the install tree has no $required, check CMAKE_INSTALL_PREFIX" >&2
              find install-tree -maxdepth 3 -type d | head -20 >&2
              exit 1
            fi
          done
          # What the Flatpak manifest expects: the tree rooted at usr/,
          # compressed the way its `type: archive` source reads it.
          tar -C install-tree -caf "stud-${VERSION}-x86_64.tar.zst" usr

      - name: Validate install tree and rpm
        # Two different questions, and both have shipped broken before.
        #
        # validate-payload asks whether the tree is any good: FSR shipped
        # with an empty shader array behind it, because every check up to
        # then looked at file names rather than inside the binary.
        #
        # compare-package-contents asks whether the package is a faithful
        # copy of that tree, so a package can never quietly lack a file
        # that the tree has. That was always found by someone installing
        # a package and noticing, one missing piece at a time.
        run: |
          python3 tools/validate-payload.py install-tree --label "install tree"
          rpm="$(find build -maxdepth 1 -name '*.rpm' | head -1)"
          [ -n "$rpm" ] || { echo "::error::no rpm was built"; exit 1; }
          python3 tools/compare-package-contents.py \
            --tree install-tree --package "$rpm" --kind rpm --work /tmp/rpm-payload
          python3 tools/validate-payload.py /tmp/rpm-payload --label "rpm"

      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: |
            build/*.rpm
            stud-*-x86_64.tar.zst
          if-no-files-found: error

  # The manifest is lint-able on its own: it needs no build, no install
  # tree and no artifact, so it gets its own job and reports within a
  # minute of the release starting rather than waiting on the build.
  #
  # It used to live in the `containers` job purely because that job has
  # podman and does not itself run inside a container, which is a
  # convenience, not a reason, and left the Flatpak manifest being
  # checked by the job that builds the Arch package and the cpak image.
  flatpak-manifest:
    name: Flatpak manifest lint
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG || 'main' }}

      - name: Lint Flatpak manifest
        # The same linter Flathub runs on a submission. It exits 0 for
        # warnings (an available runtime update is one), so errors are
        # read out of its JSON rather than from the exit code alone.
        run: |
          podman run --rm -v "$PWD:/src:z" -w /src \
            ghcr.io/flathub-infra/flatpak-builder-lint:latest \
            manifest packaging/flatpak/io.github.catpieleaf.Stud.yml | tee /tmp/flatpak-lint.json
          python3 - <<'PY'
          import json, sys
          # A manifest with nothing to report produces NO output at all,
          # not an empty JSON object, so this cannot go straight to
          # json.load. Confirmed both ways against the real linter: the
          # 6.10 manifest prints a warning object, the 6.11 one prints
          # nothing.
          text = open("/tmp/flatpak-lint.json").read().strip()
          report = json.loads(text) if text else {}
          errors = report.get("errors", [])
          if not text:
              print("flatpak-builder-lint: clean, nothing reported")
          for w in report.get("warnings", []):
              print(f"::warning::flatpak-builder-lint: {w}")
          for e in errors:
              print(f"::error::flatpak-builder-lint: {e}")
          sys.exit(1 if errors else 0)
          PY


  # Arch package and cpak image.
  #
  # These run on the runner rather than in the packages job, because that
  # job runs inside a Fedora container and podman is on the runner, not in
  # the container.
  containers:
    name: Arch package and cpak image
    needs: packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG || 'main' }}

      - name: Version
        uses: ./.github/actions/setup
        with:
          dependencies: "false"

      - uses: actions/download-artifact@v8
        with:
          name: packages
          path: artifacts

      - name: Unpack install tree
        # stud-<version>-x86_64.tar.zst IS the install tree, rooted at
        # usr/, the same archive the Flatpak and stud-bin install. No
        # second copy is made for this.
        run: |
          mkdir -p install-tree
          archive="$(find artifacts -name 'stud-*-x86_64.tar.zst' | head -1)"
          [ -n "$archive" ] || { echo "no install tree in the artifacts" >&2; exit 1; }
          tar -C install-tree -xf "$archive"
          test -d install-tree/usr

      - name: Verify the Arch recipes agree with each other and with the tree
        # The AUR serves .SRCINFO, not the PKGBUILD, so a stale one
        # advertises dependencies the package does not actually declare.
        # It is generated, never hand-edited, and drifted once already
        # (a dependency added to both PKGBUILDs and to neither .SRCINFO).
        run: |
          cat > /tmp/srcinfo.sh <<'SCRIPT'
          #!/bin/bash
          set -eu
          pacman -Sy --noconfirm --needed base-devel python binutils >/dev/null
          useradd -m builder
          status=0
          # All three PKGBUILDs describe one package, and PKGBUILD.bin --
          # the one this workflow ships -- drifted from the other two
          # without anything noticing. --tree also names which package
          # owns each library the built binaries link.
          python3 /work/tools/check-aur-depends.py --tree /work/install-tree || status=1
          for pair in "PKGBUILD:.SRCINFO" "PKGBUILD.stud-bin:.SRCINFO.stud-bin"; do
            pkgbuild="/work/packaging/aur/${pair%%:*}"
            srcinfo="/work/packaging/aur/${pair##*:}"
            install -o builder -m644 "$pkgbuild" /home/builder/PKGBUILD
            su builder -c "cd /home/builder && makepkg --printsrcinfo" > /tmp/generated
            if ! diff -u "$srcinfo" /tmp/generated; then
              echo "::error::${pair##*:} is stale, regenerate it with: makepkg --printsrcinfo > ${pair##*:}"
              status=1
            fi
          done
          exit $status
          SCRIPT
          chmod +x /tmp/srcinfo.sh
          podman run --rm -v "$PWD":/work:z -v /tmp/srcinfo.sh:/srcinfo.sh:z \
            docker.io/library/archlinux:base-devel /srcinfo.sh

      - name: Build the Qt executables against Arch's own Qt
        # The two binaries that link Qt, bin/stud and stud-webview,
        # cannot come from the fedora build. Measured on the 1.1.0
        # package, installed in a real archlinux container: it resolved
        # every library and then refused to start with
        #
        #   copy relocation against non-copyable protected symbol
        #   `_ZN12QLocalServer16staticMetaObjectE' ... error due to
        #   GNU_PROPERTY_1_NEEDED_INDIRECT_EXTERN_ACCESS
        #
        # because Arch builds Qt with indirect external access, which
        # forbids the copy relocation a binary built against Fedora's Qt
        # carries. Nothing else in the tree has that problem: render-host,
        # Process B, ANGLE and the bionic set all resolved there, since
        # none of them link Qt.
        #
        # So only the Qt half is rebuilt here, exactly as the Flatpak
        # already does it (STUD_BUILD_QT_ONLY), and it replaces those two
        # files in the install tree everything below is made from, which
        # keeps the byte comparison honest, because the comparison is
        # against this same merged tree.
        run: |
          cat > /tmp/qtbuild.sh <<'SCRIPT'
          #!/bin/bash
          set -eux
          # git because the build fetches libjnivm; without it the
          # configure step dies in FetchContent.
          pacman -Sy --noconfirm --needed base-devel cmake ninja git qt6-base qt6-webengine \
              qtkeychain-qt6 vulkan-headers vulkan-icd-loader wayland wayland-protocols \
              libxkbcommon freetype2 ffmpeg
          cmake -S /work -B /tmp/qtonly -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo \
              -DCMAKE_INSTALL_PREFIX=/usr -DSTUD_BUILD_QT_ONLY=ON -DSTUD_BUILD_TESTS=OFF \
              -DSTUD_VERSION="$STUD_VERSION"
          cmake --build /tmp/qtonly -j"$(nproc)"
          install -m755 /tmp/qtonly/ui/stud-ui /work/install-tree/usr/bin/stud
          install -m755 /tmp/qtonly/webview/stud-webview /work/install-tree/usr/libexec/stud/stud-webview
          SCRIPT
          chmod +x /tmp/qtbuild.sh
          podman run --rm -e STUD_VERSION="${VERSION}" -v "$PWD":/work:z \
            -v /tmp/qtbuild.sh:/qtbuild.sh:z docker.io/library/archlinux:latest /qtbuild.sh
          file install-tree/usr/bin/stud install-tree/usr/libexec/stud/stud-webview

      - name: Build Arch package
        # makepkg is Arch's and refuses to run as root, hence the
        # unprivileged user. It compiles nothing: the PKGBUILD copies the
        # install tree that already exists (with the two Qt binaries
        # replaced by the step above).
        run: |
          cp packaging/aur/PKGBUILD.bin "$PWD/PKGBUILD"
          # The tag's tree predates the bump the release commits to main.
          sed -i "s/^pkgver=.*/pkgver=${VERSION}/" PKGBUILD
          cat > /tmp/makepkg.sh <<'SCRIPT'
          #!/bin/bash
          # The shebang matters: this file is mounted into the container
          # and exec'd directly, and without one the kernel refuses it,
          # `exec container process /makepkg.sh: Exec format error`. It
          # went unnoticed because the step never ran this far before;
          # podman was missing from the container entirely.
          set -eux
          pacman -Sy --noconfirm --needed base-devel zstd
          useradd -m builder
          cp /work/PKGBUILD /home/builder/
          chown -R builder:builder /home/builder
          su builder -c "cd /home/builder && STUD_DESTDIR=/work/install-tree PKGEXT=.pkg.tar.zst makepkg --nodeps --noconfirm"
          cp /home/builder/*.pkg.tar.zst /work/
          SCRIPT
          chmod +x /tmp/makepkg.sh
          podman run --rm -v "$PWD":/work:z -v /tmp/makepkg.sh:/makepkg.sh:z \
            docker.io/library/archlinux:base-devel /makepkg.sh
          ls -la ./*.pkg.tar.zst

      - name: Lint Arch package
        # Arch's own package analyser, run on the real .pkg.tar.zst just
        # built. namcap exits 0 whatever it finds, so its errors are read
        # from its output. Warnings are expected and not fatal: most are
        # "uninstalled dependency", which only means the container has no
        # Arch desktop installed to resolve them against.
        run: |
          cat > /tmp/namcap.sh <<'SCRIPT'
          #!/bin/bash
          set -eu
          pacman -Sy --noconfirm --needed namcap >/dev/null
          pkg=$(find /work -maxdepth 1 -name '*.pkg.tar.zst' | head -1)
          [ -n "$pkg" ] || { echo "::error::no package for namcap to check"; exit 1; }
          namcap "$pkg" | tee /tmp/namcap.out || true
          # The Android libraries are loaded by Stud's own bionic linker
          # inside the sandbox, never by the system's, so a library they
          # name is no dependency of the package: namcap matches bionic's
          # ICU against Arch's icu by file name. Only an error whose every
          # file is one of those is set aside; the same error on a host
          # binary still fails.
          grep ' E: ' /tmp/namcap.out |
            grep -Ev "detected and not included \(libraries \[[^]]*\] needed in files \[('usr/lib/stud/(android-bionic|lib64)/[^']*'(, )?)+\]\)$" \
            > /tmp/namcap.errors || true
          if [ -s /tmp/namcap.errors ]; then
            sed 's/^/::error::namcap: /' /tmp/namcap.errors
            exit 1
          fi
          SCRIPT
          chmod +x /tmp/namcap.sh
          podman run --rm -v "$PWD":/work:z -v /tmp/namcap.sh:/namcap.sh:z \
            docker.io/library/archlinux:base-devel /namcap.sh

      - name: Validate Arch package contents
        # Held to the install tree it was made from: same files, same
        # bytes, and a payload that validates on its own terms. (The deb
        # is checked the same way, in the job that now builds it.)
        #
        # Arch relocates /usr/libexec/stud to /usr/lib/stud because namcap
        # rejects libexec; the comparison applies that one mapping rather
        # than reporting it as hundreds of differences.
        run: |
          pkg="$(find . -maxdepth 1 -name '*.pkg.tar.zst' | head -1)"
          [ -n "$pkg" ] || { echo "::error::no Arch package was built"; exit 1; }
          python3 tools/compare-package-contents.py \
            --tree install-tree --package "$pkg" --kind arch --work /tmp/arch-payload
          python3 tools/validate-payload.py /tmp/arch-payload --label "Arch package"

      - name: Build the cpak image, and publish it for a release
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          version="${VERSION}"
          # Only this file is ever built, so anything added to the
          # from-source Containerfile instead reaches nobody.
          python3 tools/check-cpak-runtime.py
          podman build -f packaging/cpak/Containerfile.prebuilt \
            -t "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/stud:${version}" \
            -t "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/stud:latest" .
          # A manual run builds the image, which is the test, and stops:
          # :latest belongs to the newest release.
          [ "$EVENT" = release ] || exit 0
          echo "$GH_TOKEN" | podman login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          podman push "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/stud:${version}"
          podman push "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/stud:latest"
          podman inspect --format '{{index .RepoDigests 0}}' \
            "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/stud:${version}" | tee cpak-image-digest.txt

      - uses: actions/upload-artifact@v7
        with:
          name: containers
          path: |
            *.pkg.tar.zst
            cpak-image-digest.txt
          if-no-files-found: error

  appimage:
    # Built on the same current base as the packages job, but without
    # its glibc floor: the AppImage carries ubuntu:26.04's glibc and C++
    # runtime and starts every executable through them (see
    # packaging/build-appimage.sh), so it runs on older distributions
    # too. packaging/Containerfile.appimage pins the same image.
    name: AppImage
    permissions:
      contents: read
    runs-on: ubuntu-latest
    # The same base packaging/Containerfile.appimage pins, for the reasons
    # given there. Running it as the job's container means
    # build-appimage.sh does not have to start one of its own.
    container: ubuntu:26.04
    env:
      STUD_APPIMAGE_IN_CONTAINER: "1"
      APPIMAGE_EXTRACT_AND_RUN: "1"
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config git curl ca-certificates \
            file desktop-file-utils zsync fuse3 unzip tar xz-utils zstd python3 e2fsprogs \
            qt6-base-dev qt6-base-dev-tools qt6-webengine-dev qt6-webengine-dev-tools \
            qt6-l10n-tools libqt6opengl6-dev qtkeychain-qt6-dev libssl-dev \
            qt6-wayland qt6-wayland-dev qt6-xdgdesktopportal-platformtheme \
            kde-style-breeze \
            libwayland-dev libwayland-egl-backend-dev wayland-protocols \
            libegl1-mesa-dev libgles2-mesa-dev libfreetype-dev libvulkan-dev \
            libxkbcommon-dev libxi-dev \
            libavcodec-dev libavutil-dev libswscale-dev

      - uses: actions/checkout@v7
        with:
          # The tag being released, not whatever the default branch holds:
          # the packages attached to a release must be built from the code
          # that release names.
          ref: ${{ env.TAG || 'main' }}

      - name: Version and dependencies
        uses: ./.github/actions/setup
        with:
          appimage-tools: "true"

      - name: Build the AppImage
        run: |
          export STUD_CMAKE_ARGS="-DSTUD_VERSION=${VERSION}"
          packaging/build-appimage.sh

      - name: Validate AppImage contents
        # This one is its OWN build, in a different container, so it can
        # drift from every other package independently, and has: the
        # release whose rpm was missing the FSR shaders had an AppImage
        # that carried them. Validated on its own terms rather than
        # compared, since nothing here shares that build's install tree.
        run: |
          appimage="$(find build-appimage/packages -name '*.AppImage' | head -1)"
          [ -n "$appimage" ] || { echo "::error::no AppImage was built"; exit 1; }
          chmod +x "$appimage"
          ( cd /tmp && "$OLDPWD/$appimage" --appimage-extract >/dev/null )
          python3 tools/validate-payload.py /tmp/squashfs-root --label "AppImage"

      - uses: actions/upload-artifact@v7
        with:
          name: appimage
          path: build-appimage/packages/*.AppImage
          if-no-files-found: error

  deb:
    # Its own job, and its own container, for one reason: a Qt program
    # built against one Qt runs on that version and everything newer, and
    # on nothing older. Qt exports a symbol version per release and the
    # loader checks it, so the floor a package sets is whatever Qt it was
    # linked against. Measured, three times now, each package installing
    # cleanly and then refusing to start:
    #
    #   ubuntu:26.04, deb built on fedora:44,
    #     `libQt6Core.so.6: version 'Qt_6.11' not found`.
    #
    #   Linux Mint 22, deb built on ubuntu:26.04,
    #     `libQt6Core.so.6: version 'Qt_6.10' not found`. Mint 22 is
    #     Ubuntu 24.04 underneath and carries Qt 6.4.
    #
    #   archlinux, Arch package built on fedora:44, `copy relocation
    #     against non-copyable protected symbol
    #     QLocalServer::staticMetaObject`, because Arch builds Qt with
    #     indirect external access.
    #
    # So the deb is built on the OLDEST distribution it is meant to run
    # on, not the newest: ubuntu:24.04, whose Qt 6.4 and glibc 2.39 cover
    # 24.04 itself, 25.x, 26.04, Debian 13 and the Mint releases built on
    # any of them. Verified on the binary rather than assumed: a build
    # there needs Qt_6.4 and nothing above it (`objdump -p`).
    #
    # It cannot share the AppImage job, which pins ubuntu:26.04
    # deliberately (packaging/Containerfile.appimage explains why: the
    # bundle carries its own Qt, and 24.04 has no KF6 for the Breeze
    # style), and it cannot share the rpm's Fedora container for the
    # reason at the top of this comment.
    name: deb
    permissions:
      contents: read
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config git curl ca-certificates \
            file desktop-file-utils unzip tar xz-utils zstd python3 e2fsprogs \
            qt6-base-dev qt6-base-dev-tools qt6-webengine-dev qt6-webengine-dev-tools \
            qt6-l10n-tools libqt6opengl6-dev qtkeychain-qt6-dev libssl-dev \
            qt6-wayland qt6-wayland-dev \
            libwayland-dev libwayland-egl-backend-dev wayland-protocols \
            libegl1-mesa-dev libgles2-mesa-dev libfreetype-dev libvulkan-dev \
            libxkbcommon-dev libxi-dev \
            libavcodec-dev libavutil-dev libswscale-dev

      - uses: actions/checkout@v7
        with:
          # The tag being released, not whatever the default branch holds.
          ref: ${{ env.TAG || 'main' }}

      - name: Version and dependencies
        uses: ./.github/actions/setup

      - name: Build
        # /usr for the same reason the packages job pins it: the install
        # tree the validation compares against comes from
        # `cmake --install`, which honours this and nothing else.
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DSTUD_REQUIRE_SHADERS=ON \
            -DSTUD_BUILD_TESTS=OFF \
            -DSTUD_VERSION="${VERSION}"
          cmake --build build -j"$(nproc)"

      - name: Check the Qt floor this build sets
        # The whole point of this job, checked on the bytes it produced.
        # Anything above Qt_6.4 here means the container moved and the
        # package silently stopped running on the distributions it is for,
        # which is exactly how this was found: by a user, after release.
        run: |
          floor="$(objdump -p build/ui/stud-ui | grep -o 'Qt_6[._0-9]*' | sort -uV | tail -1)"
          echo "stud-ui needs $floor"
          case "$floor" in
            Qt_6|Qt_6.[0-4]) ;;
            *) echo "::error::this build needs $floor, above the Qt 6.4 this job exists to target"
               exit 1 ;;
          esac

      - name: Build deb
        run: cd build && cpack -G DEB

      - name: Validate deb contents
        # Against this job's own install tree, the one the deb was
        # actually made from. Same two questions as every other package:
        # are the bytes the build's own, and is the payload complete.
        run: |
          deb="$(find build -maxdepth 1 -name '*.deb' | head -1)"
          [ -n "$deb" ] || { echo "::error::no deb was built"; exit 1; }
          DESTDIR="$PWD/deb-tree" cmake --install build --prefix /usr >/dev/null
          python3 tools/compare-package-contents.py \
            --tree deb-tree --package "$deb" --kind deb --work /tmp/deb-payload
          python3 tools/validate-payload.py /tmp/deb-payload --label "deb"
          for field in Package Version Architecture Maintainer Description; do
            value="$(dpkg-deb -f "$deb" "$field")"
            [ -n "$value" ] || { echo "::error::the deb has no $field field"; exit 1; }
            echo "$field: $value"
          done
          case "$(basename "$deb")" in
            *_*_*.deb) ;;
            *) echo "::error::$(basename "$deb") is not <package>_<version>_<arch>.deb"; exit 1 ;;
          esac

      - uses: actions/upload-artifact@v7
        with:
          name: deb
          path: build/*.deb
          if-no-files-found: error

  flatpak:
    # Needs `packages` for the archive it installs, and the manifest lint
    # because a manifest Flathub would reject is not worth spending a
    # twenty-minute build on.
    name: Flatpak bundle
    permissions:
      contents: read
    needs: [packages, flatpak-manifest]
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.10
      options: --privileged
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG || 'main' }}

      - name: Version
        uses: ./.github/actions/setup
        with:
          dependencies: "false"

      - uses: actions/download-artifact@v8
        with:
          name: packages
          path: artifacts

      - name: Prepare manifest for local sources
        # The manifest in the tree names the release URL, which does not
        # exist until this release is published, so for the bundle it is
        # rewritten to the local file. Same archive either way; only where
        # flatpak-builder reads it from differs.
        run: |
          archive="$(find artifacts -name 'stud-*-x86_64.tar.zst' | head -1)"
          [ -n "$archive" ] || { echo "no flatpak archive in the artifacts" >&2; exit 1; }
          cp "$archive" stud-archive.tar.zst
          python3 - <<'PY'
          import os, re, sys
          p = "packaging/flatpak/io.github.catpieleaf.Stud.yml"
          s = open(p).read()
          # Matches whatever checksum the manifest carries, not one literal
          # placeholder. The manifest holds the REAL sha256 of the published
          # archive so Flathub can build it as committed, keying this on a
          # placeholder meant that the moment the real value went in, the
          # substitution silently stopped matching and the build fetched the
          # release URL instead of the archive this run just produced.
          s, n = re.subn(r"        url: https://github\.com/CatPieLeaf/Stud/releases/[^\n]*\n"
                         r"        sha256: \S+\n",
                         "        path: ../../stud-archive.tar.zst\n", s)
          if n != 1:
              print(f"::error::expected one archive source to rewrite, rewrote {n}")
              sys.exit(1)
          # ...and Stud's own source, to the checkout this job already
          # has. The manifest names a release tarball so Flathub can build
          # it as committed, but that digest belongs to one specific tag:
          # re-cutting the tag changed it and the build died with "Wrong
          # sha256 checksum for 1.1.0.tar.gz". Building the checkout is
          # also the only way this job tests the code it was run against.
          #
          # A plain directory copy, not "type: git". Git needs a commit to
          # resolve, and `git rev-parse HEAD` returns nothing inside this
          # container (git refuses a repository it considers to be owned
          # by someone else), which left an empty commit in the manifest
          # and killed the build in git-lfs on an empty ref. A directory
          # has nothing to resolve.
          s, n = re.subn(r"      - type: archive\n"
                         r"        url: https://github\.com/CatPieLeaf/Stud/archive/[^\n]*\n"
                         r"        sha256: \S+\n",
                         "      - type: dir\n"
                         "        path: ../..\n"
                         "        skip:\n"
                         "          - artifacts\n"
                         "          - stud-archive.tar.zst\n"
                         "          - .git\n"
                         "          - .flatpak-builder\n"
                         "          - build-dir\n"
                         "          - flatpak-repo\n", s)
          if n != 1:
              print(f"::error::expected one source tarball to rewrite, rewrote {n}")
              sys.exit(1)
          # The tag's tree predates the bump the release commits to main,
          # so the version comes from the tag, like every other package.
          s, n = re.subn(r"-DSTUD_VERSION=\S+", "-DSTUD_VERSION=" + os.environ["VERSION"], s)
          if n != 1:
              print(f"::error::expected one -DSTUD_VERSION to rewrite, rewrote {n}")
              sys.exit(1)
          open(p, "w").write(s)
          PY
          grep -n "path: \|url: " packaging/flatpak/io.github.catpieleaf.Stud.yml

      - name: Verify no placeholders remain
        # The dependency checksums are real in the tree, Flathub builds
        # from the manifest as committed, so a manifest that only works
        # after CI has rewritten it is not one they can build at all. The
        # only substitution left is the archive path above.
        run: |
          ! grep -q PLACEHOLDER packaging/flatpak/io.github.catpieleaf.Stud.yml

      - name: Build and bundle
        run: |
          # The container image is built around one KDE SDK and the
          # manifest may name a newer one, there is no kde-6.11 image
          # yet. --install-deps-from lets flatpak-builder fetch the
          # runtime, SDK and base app the manifest actually asks for,
          # instead of the build being pinned to whatever the image
          # happens to carry.
          flatpak remote-add --if-not-exists --system flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak-builder --force-clean --disable-rofiles-fuse \
            --install-deps-from=flathub \
            --repo=flatpak-repo build-dir \
            packaging/flatpak/io.github.catpieleaf.Stud.yml
          flatpak build-bundle flatpak-repo \
            "stud-${VERSION}-x86_64.flatpak" io.github.catpieleaf.Stud

      - name: Validate Flatpak contents
        # Half of this one is compiled here and half is copied from the
        # release archive, so "did both halves land" is a real question
        # that no other package has to answer. The layout is /app rather
        # than /usr and it carries no .desktop-level files of its own in
        # that tree, so those checks are skipped.
        run: |
          python3 tools/validate-payload.py build-dir/files \
            --label "Flatpak /app" --no-desktop-files

      - uses: actions/upload-artifact@v7
        with:
          name: flatpak-bundle
          path: "*.flatpak"
          if-no-files-found: error

  publish:
    name: Publish
    permissions:
      contents: write
    needs: [packages, containers, appimage, deb, flatpak]
    # Only a release has anywhere to publish to; a manual run's packages
    # stay as the artifacts of its jobs.
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    # Not in a container: this is where the GitHub CLI already lives.
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          find artifacts -type f -printf '%f  %s bytes\n'
          # Found rather than assumed: the artifact actions have changed
          # where they unpack to before, and a release that silently gets
          # no packages attached is worse than a loud failure.
          mapfile -t packages < <(find artifacts -type f \
            \( -name '*.rpm' -o -name '*.deb' -o -name '*.AppImage' \
               -o -name '*.pkg.tar.zst' -o -name 'stud-*-x86_64.tar.zst' \
               -o -name '*.flatpak' \))
          # Every format is required. This is the last check that what
          # the release promises is actually attached to it.
          for required in '\.rpm$' '\.deb$' '\.AppImage$' '\.flatpak$' '\.pkg\.tar\.zst$'; do
            printf '%s\n' "${packages[@]}" | grep -qE "$required" ||
              { echo "no package matching $required" >&2; exit 1; }
          done
          gh release upload "$TAG" "${packages[@]}" --clobber

  # The version bump and the checksums the Flathub, AUR and cpak recipes
  # carry, both from the release that now exists (the tag name is the
  # version), committed to main so neither is ever done by hand. Its own
  # job: a failure here cannot undo the upload above, and a re-run of just
  # this job is enough to finish it.
  bump:
    name: Version and checksums
    permissions:
      contents: write
    needs: publish
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    # Not in a container: the .SRCINFO files are regenerated by makepkg in
    # an archlinux container, and podman is on the runner.
    steps:
      - uses: actions/checkout@v7
        with:
          # main, not the tag: the result is committed there.
          ref: main

      - name: Version
        uses: ./.github/actions/setup
        with:
          dependencies: "false"

      - name: Bump the version
        # A no-op when main already carries this version.
        run: python3 tools/bump-version.py "$VERSION"

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Install cpak
        # cpak.lock.json is cpak's own normalised copy of cpak.json, so only
        # cpak can write it. Pinned, and checked against the digest of the
        # release binary.
        env:
          CPAK_VERSION: v2.13.4
          CPAK_SHA256: 6dd2b082e408e2cd1aa37ae9dd8c9063b593346e8b27b0571ed5c97fe206df2f
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL -o "$RUNNER_TEMP/bin/cpak" \
            "https://github.com/Containerpak/cpak/releases/download/$CPAK_VERSION/cpak-linux-amd64"
          echo "$CPAK_SHA256  $RUNNER_TEMP/bin/cpak" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/bin/cpak"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Fill in the checksums
        # The release archive and the image digest come from this run's own
        # artifacts. The source tarball is GitHub's, so the tool downloads
        # it for the tag.
        run: |
          archive_sha="$(find artifacts -name 'stud-*-x86_64.tar.zst' -exec sha256sum {} + | cut -d' ' -f1)"
          digest="$(find artifacts -name cpak-image-digest.txt -exec cat {} + | cut -d@ -f2)"
          rm -rf artifacts
          python3 tools/fill-release-checksums.py "$TAG" \
            --archive-sha "$archive_sha" --image-digest "$digest"
          git status --short

      - name: Commit to main
        run: |
          git add -u
          if git diff --cached --quiet; then
            echo "main already carries this release's version and checksums"
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898283+github-actions[bot]@users.noreply.github.com" \
              commit -m "chore: $VERSION"
          # main may have moved while the release built; rebase once onto it.
          git push origin HEAD:main ||
            { git pull --rebase origin main && git push origin HEAD:main; }
