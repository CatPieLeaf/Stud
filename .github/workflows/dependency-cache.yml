# Fetches and caches what Rosemary's build downloads. Caches from a tag aren't
# visible to other tags, but the default branch's are visible to every ref, so this
# fills them from main. Run it after the Rosemary branch moves or when a release
# reports a cold cache.

name: Dependency cache

on:
  # Manual only. Run it from main: only the default branch's caches are shared.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-cache
  cancel-in-progress: true

jobs:
  dependencies:
    name: Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Version, Rust and the Cargo cache
        uses: ./.github/actions/setup

      - name: Fetch Rosemary's dependencies
        # Into ~/.cargo, saved by the setup step's cache; Cargo.lock decides what's fetched.
        run: |
          repo="$(sed -n 's/^set(STUD_ROSEMARY_REPOSITORY "\([^"]*\)".*/\1/p' CMakeLists.txt)"
          branch="$(sed -n 's/^set(STUD_ROSEMARY_BRANCH "\([^"]*\)".*/\1/p' CMakeLists.txt)"
          git clone --depth 1 --branch "$branch" "$repo" "$RUNNER_TEMP/rosemary"
          cargo fetch --locked --manifest-path "$RUNNER_TEMP/rosemary/Cargo.toml"
          du -sh ~/.cargo/registry ~/.cargo/git
