# What every job needs before it builds anything: which version it is
# building, and the third-party dependencies, restored from the cache or
# fetched. Run after actions/checkout, which is what puts this file there.
name: Stud setup
description: Version to build, plus the NDK, ANGLE and bionic from cache or tools/setup.sh

inputs:
  dependencies:
    description: Restore or fetch the NDK, ANGLE and bionic
    default: "true"

runs:
  using: composite
  steps:
    - name: Version
      # A release builds its tag. A manual run has none and takes the
      # version main's CMakeLists.txt declares. VERSION is TAG without a
      # leading "v": rpm and AppStream both want a bare number.
      shell: bash
      run: |
        tag="${TAG:-$(sed -n 's/^project(Stud VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)}"
        [ -n "$tag" ] || { echo "::error::no tag and no version in CMakeLists.txt"; exit 1; }
        echo "TAG=$tag" >> "$GITHUB_ENV"
        echo "VERSION=${tag#v}" >> "$GITHUB_ENV"

    - name: Free up disk space
      # Only matters on a cache miss, when ANGLE's own checkout needs
      # about 15 GB. Harmless otherwise.
      if: inputs.dependencies == 'true'
      shell: bash
      run: rm -rf /__t/CodeQL /__t/Java_Temurin-Hotspot_jdk /__t/Ruby /__t/go /__t/node || true

    - name: Work out the dependency cache keys
      # Hashes what the dependencies are, not the script that fetches
      # them; see tools/dependency-id.sh.
      if: inputs.dependencies == 'true'
      id: deps
      shell: bash
      run: |
        echo "id=$(sh tools/dependency-id.sh | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

    - name: Cache Android NDK
      # Its own key: it is a plain download, and every job wants it.
      if: inputs.dependencies == 'true'
      uses: actions/cache@v6
      with:
        path: third_party/android-ndk-r28c
        key: ndk-${{ steps.deps.outputs.id }}

    - name: Cache ANGLE and bionic
      # One key, no container in it, shared by every job: ANGLE ships its
      # own sysroot and libc++, so the build does not depend on the
      # container it ran in. See dependency-cache.yml for the measurement.
      if: inputs.dependencies == 'true'
      uses: actions/cache@v6
      with:
        path: |
          third_party/angle
          third_party/android-bionic
        key: deps-${{ steps.deps.outputs.id }}

    - name: Fetch dependencies
      # tools/setup.sh skips whatever the caches restored. A cold cache
      # builds ANGLE from source: several GB of checkout and about an hour.
      # Only the libraries it produced are kept, so its sources go straight
      # back to the disk the rest of the build needs.
      if: inputs.dependencies == 'true'
      shell: bash
      run: |
        df -h "$GITHUB_WORKSPACE" | tail -1
        tools/setup.sh
        rm -rf third_party/angle-src third_party/depot_tools
        df -h "$GITHUB_WORKSPACE" | tail -1
