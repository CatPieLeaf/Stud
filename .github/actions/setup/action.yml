# What every job needs before it builds anything: which version it is
# building, and what Rosemary's build fetches, restored from the cache.
# Run after actions/checkout, which is what puts this file there.
name: Stud setup
description: Version to build, plus Rust and Rosemary's Cargo downloads

inputs:
  rosemary:
    description: Set up Rust and restore Rosemary's Cargo downloads
    default: "true"

runs:
  using: composite
  steps:
    - name: Version
      # A release builds its tag. A manual run has none and takes the
      # version main's CMakeLists.txt declares. VERSION is TAG without a
      # leading "v": rpm and AppStream both want a bare number.
      shell: bash
      run: |
        tag="${TAG:-$(sed -n 's/^project(Stud VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)}"
        [ -n "$tag" ] || { echo "::error::no tag and no version in CMakeLists.txt"; exit 1; }
        echo "TAG=$tag" >> "$GITHUB_ENV"
        echo "VERSION=${tag#v}" >> "$GITHUB_ENV"

    - name: Rust
      # The distribution's own when the job installed one: Fedora's and
      # Arch's are new enough for Rosemary. Ubuntu's is older than
      # Rosemary's edition needs, so that job installs none and gets
      # rustup's stable here.
      if: inputs.rosemary == 'true'
      shell: bash
      run: |
        if ! command -v cargo >/dev/null; then
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs |
            sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
        fi

    - name: Work out the Cargo cache key
      # The commit of the Rosemary branch the build fetches, read from the
      # repository and branch CMakeLists.txt names. A new commit restores
      # the previous key's downloads and fetches only what changed.
      if: inputs.rosemary == 'true'
      id: rosemary
      shell: bash
      run: |
        repo="$(sed -n 's/^set(STUD_ROSEMARY_REPOSITORY "\([^"]*\)".*/\1/p' CMakeLists.txt)"
        branch="$(sed -n 's/^set(STUD_ROSEMARY_BRANCH "\([^"]*\)".*/\1/p' CMakeLists.txt)"
        sha="$(git ls-remote "$repo" "refs/heads/$branch" | cut -f1)"
        [ -n "$sha" ] || { echo "::error::cannot read $branch of $repo"; exit 1; }
        echo "sha=$sha" >> "$GITHUB_OUTPUT"

    - name: Cache Rosemary's Cargo downloads
      # One cache for every job: crates and git checkouts are the same in
      # every container. What is compiled from them is not, so the target
      # directory is not cached.
      if: inputs.rosemary == 'true'
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
        key: cargo-${{ steps.rosemary.outputs.sha }}
        restore-keys: cargo-
