app-id: io.github.catpieleaf.Stud
# QtWebEngine, which org.kde.Platform does not ship. Needed for the sign-in
# and web pages Stud shows for the client.
base: io.qt.qtwebengine.BaseApp
base-version: '6.11'
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: stud
separate-locales: false

finish-args:
  # Rendering: Rosemary draws the client through Vulkan.
  - --device=dri
  # X11 shared memory, for the fallback X11 socket.
  - --share=ipc
  # Roblox is an online game and the login is a real HTTPS session.
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  # Audio out, and microphone in for voice chat.
  - --socket=pulseaudio
  # Game controllers, read from the evdev nodes directly.
  - --device=input
  # --device=input is only understood from 1.15.6; the linter asks for 1.16.0.
  - --require-version=1.16.0
  # Discord rich presence, tried in order until one answers.
  - --filesystem=xdg-run/discord-ipc-0
  - --filesystem=xdg-run/discord-ipc-1
  - --filesystem=xdg-run/discord-ipc-2
  - --filesystem=xdg-run/discord-ipc-3
  - --filesystem=xdg-run/discord-ipc-4
  - --filesystem=xdg-run/discord-ipc-5
  - --filesystem=xdg-run/discord-ipc-6
  - --filesystem=xdg-run/discord-ipc-7
  - --filesystem=xdg-run/discord-ipc-8
  - --filesystem=xdg-run/discord-ipc-9
  # A Flatpak Discord keeps its sockets in its own directory instead.
  - --filesystem=xdg-run/app/com.discordapp.Discord:create
  - --filesystem=xdg-run/app/dev.vencord.Vesktop:create
  # QtWebEngine comes from the base app under /app, and the runtime's Qt only
  # looks beside its own prefix.
  - --env=QTWEBENGINEPROCESS_PATH=/app/bin/QtWebEngineProcess
  - --env=QTWEBENGINE_RESOURCES_PATH=/app/resources
  - --env=QTWEBENGINE_LOCALES_PATH=/app/translations/qtwebengine_locales
  # Tray icon, and the notification on joining a game.
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.freedesktop.Notifications
  # No filesystem access: customizations and FFlag imports are picked
  # through the file chooser portal.

# FFmpeg with H.264, for video in experiences: the runtime's own leaves the
# patented codecs out. Rosemary opens whichever release is there. `version`
# must match the freedesktop base under the KDE runtime above: check both
# when either is bumped.
add-extensions:
  org.freedesktop.Platform.ffmpeg-full:
    directory: lib/ffmpeg
    version: '25.08'
    add-ld-path: .
    autodownload: true
    autodelete: false

modules:
  # Rosemary needs SDL 3.4 or newer; the runtime's SDL3 is older. It opens
  # SDL3 by name, and /app/lib is searched before the runtime's.
  - name: sdl3
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DSDL_TESTS=OFF
      - -DSDL_EXAMPLES=OFF
      - -DSDL_STATIC=OFF
      - -DSDL_WAYLAND=ON
      - -DSDL_X11=ON
      - -DSDL_PIPEWIRE=ON
      - -DSDL_PULSEAUDIO=ON
    sources:
      - type: archive
        url: https://github.com/libsdl-org/SDL/releases/download/release-3.4.20/SDL3-3.4.20.tar.gz
        sha256: f3bb06f55bed9557227a700af2ea62e49497ebdf58037732a731a5fb3ef8581f
    cleanup:
      - /include
      - /lib/cmake
      - /lib/pkgconfig
      - /share

  # wl-copy, for copying a server link from the tray menu.
  - name: wl-clipboard
    buildsystem: meson
    config-opts:
      # Its fish and zsh completions install outside the prefix.
      - -Dfishcompletiondir=no
      - -Dzshcompletiondir=no
    sources:
      - type: archive
        url: https://github.com/bugaevc/wl-clipboard/archive/refs/tags/v2.2.1.tar.gz
        sha256: 6eb8081207fb5581d1d82c4bcd9587205a31a3d47bea3ebeb7f41aa1143783eb
    cleanup:
      - /share/man
      - /share/bash-completion

  # Rosemary, built here against the runtime's own glibc and libraries, from
  # Stud's fork. The build has no network, so its Cargo dependencies, the git
  # ones included, come from rosemary-cargo-sources.json, which
  # tools/update-flatpak-rosemary.sh generates from the commit's Cargo.lock.
  # glslc, for the upscalers' shaders, is in the SDK.
  #
  # Rust is the current stable release's official archive, which the same
  # script writes in: Flathub's Rust extension can trail the release Rosemary
  # needs. It is installed into the build directory, used, and never shipped.
  - name: rosemary
    buildsystem: simple
    build-options:
      append-path: /run/build/rosemary/toolchain/bin
      env:
        CARGO_HOME: /run/build/rosemary/cargo
        CARGO_NET_OFFLINE: 'true'
    build-commands:
      - rust/install.sh --prefix=/run/build/rosemary/toolchain --disable-ldconfig
        --components=rustc,cargo,rust-std-x86_64-unknown-linux-gnu
      - cargo --offline build --release --locked --package rosemary --bin rosemary
      - install -Dm755 target/release/rosemary -t /app/libexec/stud/
      - install -Dm644 LICENSE /app/share/licenses/io.github.catpieleaf.Stud/rosemary/LICENSE-Rosemary.txt
    sources:
      - type: git
        url: https://github.com/CatPieLeaf/rosemary-stud.git
        commit: 2445c2223cf789e71567f2ee40cece459c40c8aa
      - type: archive
        url: https://static.rust-lang.org/dist/2026-11-12/rust-1.100.0-x86_64-unknown-linux-gnu.tar.xz
        sha256: 98ee6bec240e1cfe944f17e7092412dc5ef6e008484bb668c6936d35a7d15acd
        dest: rust
        only-arches:
          - x86_64
      - rosemary-cargo-sources.json

  # The launcher, built here against the runtime's own Qt.
  - name: stud
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - -DSTUD_BUILD_ROSEMARY=OFF
      - -DSTUD_BUILD_TESTS=OFF
      - -DSTUD_VERSION=1.2.14
      # No network during the build, so these are supplied as sources.
      - -DFETCHCONTENT_FULLY_DISCONNECTED=ON
      - -DFETCHCONTENT_SOURCE_DIR_MINIZ=/run/build/stud/deps/miniz
      - -DFETCHCONTENT_SOURCE_DIR_NLOHMANN_JSON=/run/build/stud/deps/json
    # A distribution package looks in share/licenses/<package>; Flathub asks
    # for share/licenses/<app id>.
    post-install:
      - mkdir -p /app/share/licenses/io.github.catpieleaf.Stud
      - cp -a /app/share/licenses/stud/. /app/share/licenses/io.github.catpieleaf.Stud/
      - rm -rf /app/share/licenses/stud
    sources:
      - type: archive
        url: https://github.com/CatPieLeaf/Stud/archive/refs/tags/1.2.14.tar.gz
        sha256: a10ed5340e5879ab961b5bdf0db235320abb8ae45675407ebf42669f9bb73e45
      - type: archive
        url: https://github.com/richgel999/miniz/archive/refs/tags/3.1.2.tar.gz
        sha256: 98468f8924934b723276680f85238b6c78bf1f8b49b4459cc9b7214a20e2e9fb
        dest: deps/miniz
      - type: archive
        url: https://github.com/nlohmann/json/archive/refs/tags/v3.11.3.tar.gz
        sha256: 0d8ef5af7f9794e3263480193c491549b2ba6cc74bb018906202ada498a79406
        dest: deps/json
