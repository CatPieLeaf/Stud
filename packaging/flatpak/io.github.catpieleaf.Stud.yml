# Flatpak manifest for Flathub.
#
# It installs a prebuilt archive rather than building from source, and
# that is not a shortcut. It is the only thing that can work. Stud needs
# ANGLE with both its Vulkan and its SwiftShader backends, which no
# distribution ships, so it is compiled from source; and ANGLE's own build
# uses `gclient sync`, which downloads dozens of dependencies while it
# runs. Flathub builds have no network. There is no self-contained ANGLE
# source tarball to pin instead.
#
# The precedent is Sober (org.vinegarhq.Sober), which is the same kind of
# application, the real Roblox Android app on Linux, and which ships
# its own prebuilt archive from its own server with a sha256. Every
# permission below follows theirs, for the same reasons.
#
# The archive is built by Stud's own CI from the tag being released, so
# what ships here is the same binary as the rpm, the deb and the AppImage.
# If Flathub would rather have a from-source build, the way to give them
# one is a vendored ANGLE checkout published as a source bundle (post
# `gclient sync`, a few GB), possible, and a much larger build.

app-id: io.github.catpieleaf.Stud
# QtWebEngine, which org.kde.Platform does NOT ship, checked directly:
# there is no libQt6WebEngine* anywhere in 6.10 or 6.11, and stud-webview
# could not even load ("libQt6WebEngineWidgets.so.6: cannot open shared
# object file"), so every web panel and every login challenge was dead.
# This base app is how a Flathub application gets it, and its branch
# tracks the runtime's.
base: io.qt.qtwebengine.BaseApp
base-version: '6.11'
runtime: org.kde.Platform
# The current runtime. This used to sit on 6.10 because the release
# workflow builds in ghcr.io/flathub-infra/flatpak-github-actions, whose
# tag list still stops at kde-6.10, so the container has no 6.11 SDK of
# its own. That only mattered while the Qt executables were built
# elsewhere and copied in; now they are compiled here, the workflow
# installs the runtime it needs with `--install-deps-from=flathub` and
# builds against whatever this names.
runtime-version: '6.11'
sdk: org.kde.Sdk
command: stud
separate-locales: false

finish-args:
  # Rendering. Stud's whole reason to exist is that the GPU driver runs in
  # its own process; it still needs the device to do it.
  - --device=dri
  # Process B runs inside its own bwrap, with its own user namespace.
  # That is the architecture, not an optional hardening step. A nested
  # sandbox needs this. (Sober requires the same, for ptrace.)
  - --allow=devel
  # The engine expects a shared IPC namespace for X11 shared memory.
  # Wayland does not need it; the X11 fallback does.
  - --share=ipc
  # Roblox is an online game and Stud's login is a real HTTPS session.
  - --share=network
  # Wayland first. X11 is the fallback, and the one that needs --share=ipc.
  - --socket=wayland
  - --socket=fallback-x11
  # Audio out, and microphone in for voice chat. This is the PulseAudio
  # socket; on a PipeWire desktop it is pipewire-pulse that answers it.
  # PortAudio reaches it through the runtime's own ALSA pulse plugin,
  # which its 99-pulseaudio-default.conf already makes the default device
  # measured in the sandbox: Pa_Initialize() returns 0 and enumerates
  # 14 devices.
  - --socket=pulseaudio
  # Game controllers. render-host reads the evdev nodes directly
  # (render-host/src/gamepad.cpp), and without this the sandbox has no
  # /dev/input at all, so Stud's own diagnostics report "controllers:
  # /dev/input unreadable" where a native run lists the real devices.
  - --device=input
  # --device=input is only understood from flatpak 1.15.6, and an older
  # one would take the app without honouring it. Flathub asks for the
  # floor to be stated, and asks for a higher one than the protocol
  # strictly needs, `finish-args-insufficient-required-flatpak:
  # finish-args has 'input' or 'usb' device but 'require-version' is not
  # >=1.16.0`, so 1.16.0 it is, which is the first stable release
  # carrying it.
  - --require-version=1.16.0
  # Discord Rich Presence, which is a plain socket in the runtime
  # directory, discord-ipc-0 through -9, tried in order
  # (render-host/src/discord_rpc.cpp). Not visible in the sandbox
  # otherwise, so the feature was silently dead here.
  - --filesystem=xdg-run/discord-ipc-0
  - --filesystem=xdg-run/discord-ipc-1
  - --filesystem=xdg-run/discord-ipc-2
  - --filesystem=xdg-run/discord-ipc-3
  - --filesystem=xdg-run/discord-ipc-4
  - --filesystem=xdg-run/discord-ipc-5
  - --filesystem=xdg-run/discord-ipc-6
  - --filesystem=xdg-run/discord-ipc-7
  - --filesystem=xdg-run/discord-ipc-8
  - --filesystem=xdg-run/discord-ipc-9
  # No filesystem access is requested. The APK is chosen through a
  # QFileDialog, which Qt routes to the file chooser portal inside a
  # sandbox, the portal hands back a path under /run/user/<uid>/doc/
  # that stays readable on later launches, so a static grant on
  # xdg-download and xdg-documents would only widen what Stud can read
  # without letting it read anything it needs.
  #
  # Verify on the first real Flatpak build: pick an APK in Settings, then
  # relaunch and confirm it is still readable. If the portal path does not
  # survive, the honest fix is --filesystem=xdg-download:ro, not a wider
  # grant, and config.json takes a path by hand either way.
  # The keyring, which holds the key the login is encrypted with, not
  # the login itself. Without it that encrypted file cannot be read, so
  # Stud would have to fall back to storing the cookie in the clear.
  - --talk-name=org.freedesktop.secrets
  # QtWebEngine comes from the base app, which installs under /app, while
  # Qt itself comes from the runtime and only looks beside its own prefix:
  #
  #   The following paths were searched for Qt WebEngine Process:
  #     /usr/lib/libexec/QtWebEngineProcess
  #     /usr/bin/QtWebEngineProcess
  #     /app/libexec/stud/QtWebEngineProcess
  #   but could not find it.
  #
  # stud-webview aborted on exactly that (SIGABRT, twice, caught in
  # coredumpctl) the moment a login challenge opened a web view, so
  # logging in through the Flatpak could never complete. Its resources and
  # locales live under /app for the same reason and are named here too.
  - --env=QTWEBENGINEPROCESS_PATH=/app/bin/QtWebEngineProcess
  - --env=QTWEBENGINE_RESOURCES_PATH=/app/resources
  - --env=QTWEBENGINE_LOCALES_PATH=/app/translations/qtwebengine_locales
  # The tray icon, and the notification Stud raises when a game server's
  # region is known.
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.freedesktop.Notifications
  # Deliberately NOT here: --talk-name=org.kde.KWin.
  #
  # render-host's last-resort way to raise the window when a browser link
  # arrives and Stud is already running goes through KWin's own scripting
  # interface, because xdg-activation cannot do it (measured: KDE passes
  # no token to a URL handler, and a self-minted one is refused since its
  # serial is from Stud's last input, not the browser's click). Flathub
  # rejects that permission outright; `flatpak-builder-lint:
  # finish-args-kwin-talk-name`, and it is a fair rejection: talking to
  # KWin's scripting interface is running arbitrary code in the
  # compositor.
  #
  # So in a Flatpak the window does not come forward on KDE, and the game
  # opens behind whatever is in front. A user who wants it can grant the
  # permission themselves, which is a decision that belongs to them
  # rather than to this manifest:
  #
  #   flatpak override --user --talk-name=org.kde.KWin io.github.catpieleaf.Stud

modules:
  # bubblewrap, from source. The runtime does not carry it, and Stud will
  # not start without one: Process B is launched inside it.
  - name: bubblewrap
    buildsystem: meson
    config-opts:
      # These are bubblewrap 0.11.0's real meson options, checked against
      # the tarball this manifest pins. There is no "setuid" option; it
      # was passed here once and the build died with `Unknown option:
      # "setuid"`. A plain build is already non-setuid, which is what a
      # Flatpak needs.
      - -Dprogram_prefix=
      - -Dman=disabled
      - -Dtests=false
    sources:
      - type: archive
        url: https://github.com/containers/bubblewrap/releases/download/v0.11.0/bubblewrap-0.11.0.tar.xz
        sha256: 988fd6b232dafa04b8b8198723efeaccdb3c6aa9c1c7936219d5791a8b7a8646
    cleanup:
      - /share/bash-completion
      - /share/zsh

  # wl-clipboard, for the tray's "copy server link".
  #
  # A Wayland compositor only accepts a clipboard offer with the serial
  # of a real input event on one of the application's own surfaces, and
  # the tray menu is the desktop's own, not a Qt surface, so
  # QClipboard::setText copies nothing from there and Stud shells out to
  # wl-copy, which owns the selection in its own process (ui/src/tray.cpp
  # explains it at the call site). A distribution install gets that from
  # the wl-clipboard package; inside the sandbox it has to be here, or
  # the menu entry reports "this desktop needs wl-clipboard installed".
  - name: wl-clipboard
    buildsystem: meson
    config-opts:
      # Its fish completions install to an absolute /usr/share/fish,
      # which is read-only here, the build died on it with
      # `Unhandled python OSError` out of meson's install step. Stud
      # calls the binary; no shell needs to complete it.
      - -Dfishcompletiondir=no
      - -Dzshcompletiondir=no
    sources:
      - type: archive
        url: https://github.com/bugaevc/wl-clipboard/archive/refs/tags/v2.2.1.tar.gz
        sha256: 6eb8081207fb5581d1d82c4bcd9587205a31a3d47bea3ebeb7f41aa1143783eb
    cleanup:
      - /share/man
      - /share/bash-completion

  # PortAudio. render-host loads it by name at runtime, so it must be in
  # the sandbox even though nothing links against it.
  - name: portaudio
    buildsystem: cmake-ninja
    config-opts:
      # PortAudio 19.7.0 asks for CMake 2.8, and CMake 4, which the
      # runtime ships, removed compatibility below 3.5 outright:
      # `Compatibility with CMake < 3.5 has been removed from CMake.`
      # Reproduced locally against CMake 4.3 and confirmed this is what
      # clears it. Upstream's own fix is a newer release; this pins the
      # version already checksummed here rather than changing it.
      - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
      - -DPA_BUILD_SHARED_LIBS=ON
      - -DPA_BUILD_TESTS=OFF
      - -DPA_BUILD_EXAMPLES=OFF
    sources:
      - type: archive
        url: https://github.com/PortAudio/portaudio/archive/refs/tags/v19.7.0.tar.gz
        sha256: 5af29ba58bbdbb7bbcefaaecc77ec8fc413f0db6f4c4e286c40c3e1b83174fa0
    post-install:
      # Two things are wrong with the obvious placement, and both were
      # measured in the sandbox rather than guessed:
      #
      # PortAudio's own CMake sets its SONAME to a bare libportaudio.so,
      # while every distribution, and render-host's own dlopen, uses
      # libportaudio.so.2.
      #
      # And a bare dlopen("libportaudio.so.2") fails here even with the
      # file in /app/lib, because LD_LIBRARY_PATH is empty in a Flatpak
      # and /app/lib reaches the loader through /etc/ld.so.conf, which
      # the loader never reads (it reads only the cache). Loading the
      # same file by its full path works: Pa_Initialize() returns 0 and
      # finds 14 devices.
      #
      # So it also goes where render-host looks for a bundled copy by
      # absolute path, <exe dir>/../lib/stud/audio/libportaudio.so.2,
      # the same fallback the AppImage uses (render-host/src/
      # audio_output.cpp's bundled_portaudio_path()).
      - ln -sf libportaudio.so /app/lib/libportaudio.so.2
      - install -d /app/lib/stud/audio
      - ln -sf ../../libportaudio.so /app/lib/stud/audio/libportaudio.so.2
    cleanup:
      # Nothing in the bundle links against it.
      - /lib/libportaudio.a

  # QtKeychain, for the login. Qt itself comes from the runtime.
  - name: qtkeychain
    buildsystem: cmake-ninja
    config-opts:
      - -DBUILD_WITH_QT6=ON
      - -DQTKEYCHAIN_STATIC=OFF
      - -DBUILD_TRANSLATIONS=OFF
    sources:
      - type: archive
        url: https://github.com/frankosterfeld/qtkeychain/archive/refs/tags/0.14.3.tar.gz
        sha256: a22c708f351431d8736a0ac5c562414f2b7bb919a6292cbca1ff7ac0849cb0a7

  # The prebuilt half: ANGLE, the extracted bionic runtime, the render
  # host and Process B. None of it links Qt, and building ANGLE here
  # would add an hour to every Flatpak build for no benefit.
  #
  # Deliberately does NOT install usr/bin/stud or stud-webview from this
  # archive. Those two are the Qt executables, and a Qt binary built
  # against another distribution's Qt is what made this Flatpak crash
  # inside Qt's own startup before a line of Stud ran, the module below
  # compiles them against the runtime's own Qt instead.
  - name: stud-prebuilt
    buildsystem: simple
    build-commands:
      - mkdir -p /app/lib/stud /app/libexec/stud /app/share/licenses
      - cp -a usr/lib/stud/. /app/lib/stud/
      - cp -a usr/libexec/stud/lib64 /app/libexec/stud/lib64
      - install -Dm755 usr/libexec/stud/stud-render-host -t /app/libexec/stud/
      - install -Dm755 usr/libexec/stud/stud-runtime-bionic -t /app/libexec/stud/
      # The licences of everything above, which the Qt-only build has no
      # reason to know about and therefore does not install.
      - cp -a usr/share/licenses/. /app/share/licenses/
    sources:
      # Replaced at release time by CI, which knows the tag and the digest
      # of the archive it just built. Never "latest": a manifest that can
      # change what it installs without changing what it says is not
      # reproducible.
      - type: archive
        url: https://github.com/CatPieLeaf/Stud/releases/download/1.1.0/stud-1.1.0-x86_64.tar.zst
        sha256: PLACEHOLDER_STUD_SHA256
        # This archive IS the install tree, rooted at usr/, and every
        # build-command above addresses it that way. flatpak-builder
        # strips one leading component from an archive by default, which
        # turned usr/bin into bin and failed with
        # `cp: cannot stat 'usr/bin/.'`.
        strip-components: 0
        only-arches:
          - x86_64

  # The Qt half, compiled here against the runtime's own Qt.
  #
  # STUD_BUILD_QT_ONLY builds just the two executables that link Qt.
  # Stud and stud-webview, and skips the render host, the bionic
  # runtime and ANGLE, which the module above supplies prebuilt.
  #
  # The three dependencies CMake would otherwise fetch over the network
  # are supplied as sources instead, because a Flatpak build has no
  # network. FETCHCONTENT_SOURCE_DIR_<NAME> is CMake's own documented way
  # to hand FetchContent a directory it already has.
  - name: stud
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - -DSTUD_BUILD_QT_ONLY=ON
      - -DSTUD_BUILD_TESTS=OFF
      - -DSTUD_VERSION=1.1.0
      - -DFETCHCONTENT_FULLY_DISCONNECTED=ON
      - -DFETCHCONTENT_SOURCE_DIR_MINIZ=/run/build/stud/deps/miniz
      - -DFETCHCONTENT_SOURCE_DIR_LIBJNIVM=/run/build/stud/deps/libjnivm
      - -DFETCHCONTENT_SOURCE_DIR_NLOHMANN_JSON=/run/build/stud/deps/json
    sources:
      # Stud's own source, for the tag this manifest describes. The
      # release workflow replaces this with the checkout it already has
      # (see "Point the manifest at what this run built"), so CI never
      # depends on this digest, which matters, because a re-cut tag
      # changes it and the build failed exactly that way once.
      - type: archive
        url: https://github.com/CatPieLeaf/Stud/archive/refs/tags/1.1.0.tar.gz
        sha256: PLACEHOLDER_SOURCE_SHA256
      - type: archive
        url: https://github.com/richgel999/miniz/archive/refs/tags/3.1.2.tar.gz
        sha256: 98468f8924934b723276680f85238b6c78bf1f8b49b4459cc9b7214a20e2e9fb
        dest: deps/miniz
      - type: archive
        url: https://github.com/nlohmann/json/archive/refs/tags/v3.11.3.tar.gz
        sha256: 0d8ef5af7f9794e3263480193c491549b2ba6cc74bb018906202ada498a79406
        dest: deps/json
      # Pinned to a commit: the build declares this one with GIT_TAG main,
      # which is not something a reproducible package can follow.
      - type: git
        url: https://github.com/ChristopherHX/libjnivm.git
        commit: f24b98c198fcc5c59a68d1efadd3f5791eb01c2e
        dest: deps/libjnivm
